[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peval-gold"
version = "0.1.0"
description = "Reusable framework for predictor / calibrator / acquisition / evaluator abstractions in predictive-evaluation ML competitions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ankit Aggarwal" },
]
keywords = [
    "predictive-evaluation",
    "irt",
    "item-response-theory",
    "calibration",
    "machine-learning",
    "ml-evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<4.0",
    "scipy>=1.10,<2.0",
    "torch>=2.0,<5.0",
    "datasets>=4.0,<6.0",
    "xxhash>=3.0,<5.0",
]

[project.optional-dependencies]
# Encoder-backed acquisition + CAIMIRA-lite (heavy ML deps; opt-in).
full = [
    "transformers>=4.40,<6.0",
    "sentence-transformers>=3.0,<6.0",
]
# Test runner + coverage.
test = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
]
# Lint + build tooling.
dev = [
    "ruff>=0.6,<1.0",
    "build>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/ankaggarwal94/peval-gold"
Repository = "https://github.com/ankaggarwal94/peval-gold"
Issues = "https://github.com/ankaggarwal94/peval-gold/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: encoder-load heavy tests (e.g., all-mpnet-base-v2)",
    "network: requires Hugging Face dataset network access",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (ruff format handles this)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
